function exp(){const t=JSON.stringify({v:2,careers:all(),cfg:CFG});try{const b=new Blob([t],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='penaltis-partidas.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
 $('#ex').innerHTML='<p class="mut">Copia este texto y guárdalo (o usa el archivo descargado):</p><textarea readonly style="width:100%;height:70px"></textarea>';$('#ex textarea').value=t;toast('Partidas exportadas')}
function impD(d){const a=all();(d.careers||[]).forEach(c=>{const i=a.findIndex(x=>x.id==c.id);if(i<0)a.push(c);else a[i]=c});localStorage.setItem('pcar2',JSON.stringify(a));toast('Importadas '+(d.careers||[]).length+' carreras');ajustes()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{impD(JSON.parse(r.result))}catch(e){toast('Archivo no válido')}};r.readAsText(f)}
function impT(){try{impD(JSON.parse($('#imt').value))}catch(e){toast('Texto no válido')}}
function delAll(){if(!DA){DA=1;return ajustes()}DA=0;['pcar2','pcar','pcar_cfg','pcar_names','pcar_tut'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});S=null;NAMES={};Object.keys(LG).forEach(k=>LG[k].div=genNames(k));setLg('es');toast('Datos borrados');setup()}
function nombres(){const lc=BN||LC;$('#app').innerHTML=`<h1>Editor de nombres</h1><div class="card"><p class="mut">Cada línea es un club: las 20 primeras son la división más baja y las 20 últimas la más alta. Se usan en las carreras nuevas.</p><div class="row">${Object.keys(LG).map(k=>`<button class="${k==lc?'':'g'}" style="flex:1;min-width:84px" onclick="BN='${k}';nombres()">${LG[k].n}</button>`).join('')}</div><textarea id="nm" style="width:100%;height:300px;margin-top:8px"></textarea><div class="row"><button onclick="saveN('${lc}')">Guardar</button><button class="g" onclick="resN('${lc}')">Restaurar</button><button class="g" onclick="ajustes()">Volver</button></div></div>`;$('#nm').value=LG[lc].div.flat().join('\n')}
let BN=null;
function saveN(lc){const a=$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean);if(a.length!=100||new Set(a).size!=100)return toast('Necesito 100 nombres distintos (uno por línea). Ahora hay '+a.length+'.');NAMES[lc]=a;try{localStorage.setItem('pcar_names',JSON.stringify(NAMES))}catch(e){}LG[lc].div=genNames(lc);if(lc==LC)DIV=LG[lc].div;toast('Nombres guardados para las carreras nuevas')}
function resN(lc){delete NAMES[lc];try{localStorage.setItem('pcar_names',JSON.stringify(NAMES))}catch(e){}LG[lc].div=genNames(lc);if(lc==LC)DIV=LG[lc].div;nombres()}

function sec(out,fst){const G=[['🏟 Liga',/^(Posición|🏆|📈|📉|Te mantienes|🌍|Los 3)/],['🏅 Premios',/^(🥇|🅰|🧤)/],['🎯 Directiva',/^(✅|❌|🟥)/],['💰 Finanzas',/^(Ingresos|La directiva te da)/],['👥 Plantilla',/^(👴|🆓)/],['🔁 Mercado',/^(🔁|🌱)/]];
